name: Setup Rust
description: Checkout 调用方和本仓库脚本，并按 rust-toolchain 文件安装工具链。

inputs:
  toolchain:
    description: 仓库没有 rust-toolchain 文件时使用的 toolchain。不要传浮动的 stable。
    required: false
    default: ""
  working-directory:
    description: Cargo workspace 根目录，相对仓库根。
    required: false
    default: "."
  components:
    description: 额外 rustup 组件，逗号分隔。
    required: false
    default: ""
  fetch-depth:
    description: 调用方 checkout 的 fetch-depth。
    required: false
    default: "1"
  fetch-tags:
    description: 为 true 时抓取 tags。
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout caller
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags == 'true' }}

    - name: Checkout workflow scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .burncloud-ci
        persist-credentials: false

    - name: Resolve toolchain
      id: resolve
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        channel=""
        file=""
        for candidate in rust-toolchain.toml rust-toolchain "${WORKING_DIRECTORY}/rust-toolchain.toml" "${WORKING_DIRECTORY}/rust-toolchain"; do
          if [[ -f "$candidate" ]]; then
            file=$candidate
            break
          fi
        done
        if [[ -n "$file" ]]; then
          if [[ "$file" == *.toml ]]; then
            channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$file" | head -n 1)
          else
            channel=$(head -n 1 "$file" | tr -d '[:space:]')
          fi
          if [[ -z "$channel" ]]; then
            echo "无法从 ${file} 解析 channel。" >&2
            exit 1
          fi
          echo "使用 ${file} 里的 toolchain ${channel}。"
        elif [[ -n "$TOOLCHAIN" ]]; then
          channel=$TOOLCHAIN
          echo "仓库没有 rust-toolchain 文件，使用输入 toolchain ${channel}。"
        else
          echo "没有 rust-toolchain.toml，也没有 toolchain 输入。请在仓库根提交并保护 rust-toolchain.toml。" >&2
          exit 1
        fi
        echo "toolchain=${channel}" >> "$GITHUB_OUTPUT"

    - name: Install toolchain
      if: inputs.components == ''
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}

    - name: Install toolchain with components
      if: inputs.components != ''
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        workspaces: ${{ inputs.working-directory }}
