name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-toolchain.toml
        id: toolchain
        run: bash scripts/resolve-toolchain.sh

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}

      - name: Install linters
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: actionlint -shellcheck "$(command -v shellcheck)"

      - name: Check ruleset JSON
        run: python3 scripts/check-rulesets.py

      - name: Check ruleset readback
        run: |
          set -euo pipefail
          script=scripts/check-ruleset-readback.sh
          expect_exit() {
            local want=$1
            local name=$2
            shift 2
            local status=0
            "$@" >/tmp/ruleset-readback.out 2>/tmp/ruleset-readback.err || status=$?
            if [[ "$status" -ne "$want" ]]; then
              echo "FAIL ${name}: 预期 exit ${want}，实际 exit ${status}" >&2
              cat /tmp/ruleset-readback.err >&2
              exit 1
            fi
            echo "PASS ${name} exit ${status}"
          }
          submitted=docs/rulesets/crate-main.json
          expect_exit 0 crate-ok bash "$script" "$submitted" tests/ruleset-readback/crate-main/ok.json
          for name in extra-bypass bypass-mode-always exclude-default-branch include-changed check-name-longer missing-check extra-check integration-id-changed missing-deletion code-owner-false approval-count-zero enforcement-mismatch; do
            expect_exit 1 "$name" bash "$script" "$submitted" "tests/ruleset-readback/crate-main/${name}.json"
          done
          expect_exit 0 ci-tags-ok bash "$script" docs/rulesets/ci-tags.json tests/ruleset-readback/ci-tags/ok.json
          expect_exit 0 ci-tags-server-readback bash "$script" docs/rulesets/ci-tags.json tests/ruleset-readback/ci-tags/server-readback.json
          expect_exit 1 ci-tags-extra-bypass bash "$script" docs/rulesets/ci-tags.json tests/ruleset-readback/ci-tags/extra-bypass.json

      - name: Check scripts
        run: |
          set -euo pipefail
          root=$(pwd)
          tmp=$(mktemp -d)

          defaults=$(bash scripts/check-protected-paths.sh --print-defaults)
          for line in .github/ .cargo/ vendor/ unsafe-crates.txt rust-toolchain.toml 'Cargo.toml@removed' 'Cargo.toml[lints]'; do
            if ! printf '%s\n' "$defaults" | grep -Fxq "$line"; then
              echo "默认路径缺少 ${line}" >&2
              exit 1
            fi
          done
          if grep -n 'default: |' .github/workflows/protect.yml .github/workflows/rust.yml; then
            echo "受保护路径默认值只能留在 scripts/check-protected-paths.sh。" >&2
            exit 1
          fi

          printf '%s\n' 'src/lib.rs' > "${tmp}/ok"
          bash scripts/check-protected-paths.sh --changed "${tmp}/ok"

          printf '%s\n' '.github/workflows/ci.yml' > "${tmp}/bad"
          if bash scripts/check-protected-paths.sh --changed "${tmp}/bad"; then
            echo "预期 .github/ 命中后失败。" >&2
            exit 1
          fi
          bash scripts/check-protected-paths.sh --changed "${tmp}/bad" --exempt

          printf '%s\n' 'crates/foo/deny.toml' 'contracts/api.md' 'supply-chain/config.toml' 'rust-toolchain.toml' '.cargo/config.toml' 'vendor/serde/src/lib.rs' > "${tmp}/bad"
          if bash scripts/check-protected-paths.sh --changed "${tmp}/bad"; then
            echo "预期受保护文件命中后失败。" >&2
            exit 1
          fi

          printf 'removed\tCargo.toml\n' > "${tmp}/deleted-root"
          if bash scripts/check-protected-paths.sh --changed "${tmp}/deleted-root"; then
            echo "预期删除根 Cargo.toml 失败。" >&2
            exit 1
          fi
          printf 'modified\tCargo.toml\n' > "${tmp}/edited-root"
          printf '[package]\nname = "x"\nversion = "0.1.0"\n' > "${tmp}/before"
          printf '[package]\nname = "x"\nversion = "0.2.0"\n' > "${tmp}/after"
          printf 'Cargo.toml|%s|%s\n' "${tmp}/before" "${tmp}/after" > "${tmp}/lints"
          bash scripts/check-protected-paths.sh --changed "${tmp}/edited-root" --lints "${tmp}/lints"

          printf '%s\n' Cargo.toml > "${tmp}/changed"
          expect_fail() {
            local label=$1
            local after=$2
            printf '%s\n' "$after" > "${tmp}/section-after"
            printf 'Cargo.toml|%s|%s\n' "${tmp}/before" "${tmp}/section-after" > "${tmp}/lints"
            if bash scripts/check-protected-paths.sh --changed "${tmp}/changed" --lints "${tmp}/lints"; then
              echo "预期 ${label} 变化失败。" >&2
              exit 1
            fi
          }
          expect_fail 'dotted lints' $'lints.clippy.pedantic = { level = "allow", priority = -1 }\n'
          expect_fail 'dotted patch' $'patch.crates-io.foo = { path = "v" }\n'
          expect_fail 'spaced table' $'[ patch.crates-io ]\nfoo = { path = "v" }\n'
          expect_fail 'quoted table' $'[ "patch" . "crates-io" ]\nfoo = { path = "v" }\n'
          expect_fail '[lints]' $'[package]\nname = "x"\n\n[lints.clippy]\npedantic = "allow"\n'

          : > "${tmp}/empty-paths"
          if bash scripts/check-protected-paths.sh --changed "${tmp}/bad" --paths "${tmp}/empty-paths"; then
            echo "空路径列表必须回退到默认值并失败。" >&2
            exit 1
          fi

          bash scripts/check-unsafe.sh tests/fixture

          bad=$(mktemp -d)
          mkdir -p "$bad/src"
          printf '%s\n' '[package]' 'name = "bypass-unsafe"' 'version = "0.1.0"' 'edition = "2021"' 'license = "MIT OR Apache-2.0"' > "$bad/Cargo.toml"
          printf '%s\n' '/*' '#![forbid(unsafe_code)]' '*/' "pub fn f<'a>(x: &u8) -> u8 { unsafe { *(x as *const u8) } }" > "$bad/src/lib.rs"
          cargo check --manifest-path "$bad/Cargo.toml" --offline || cargo check --manifest-path "$bad/Cargo.toml"
          if bash scripts/check-unsafe.sh "$bad"; then
            echo "预期块注释里的 forbid 不能通过 unsafe 检查。" >&2
            exit 1
          fi

          if bash scripts/run-cargo-vet.sh --classify-source 'registry+https://github.com/rust-lang/crates.io-index'; then
            echo "预期 crates.io 来源不被信任。" >&2
            exit 1
          fi
          if bash scripts/run-cargo-vet.sh --classify-source 'git+https://github.com/evil/burncloud-foo.git'; then
            echo "预期非 burncloud 组织的 git 来源不被信任。" >&2
            exit 1
          fi
          if bash scripts/run-cargo-vet.sh --classify-source 'git+https://github.com/burncloud/../evil/x.git'; then
            echo "预期带 ../ 的 git 来源不被信任。" >&2
            exit 1
          fi
          if bash scripts/run-cargo-vet.sh --classify-source 'git+https://github.com/burncloud/%2e%2e/evil/x.git'; then
            echo "预期带百分号编码的 git 来源不被信任。" >&2
            exit 1
          fi
          if bash scripts/run-cargo-vet.sh --classify-source 'git+https://burncloud.evil.com/burncloud/foo.git'; then
            echo "预期非 github.com 主机不被信任。" >&2
            exit 1
          fi
          if bash scripts/run-cargo-vet.sh --classify-source 'git+https://github.com/burncloud-evil/foo.git'; then
            echo "预期 owner 不是 burncloud 的 git 来源不被信任。" >&2
            exit 1
          fi
          bash scripts/run-cargo-vet.sh --classify-source 'git+https://github.com/burncloud/foo.git?tag=v1#abc'

          scan=$(bash scripts/scan-capabilities.sh tests/fixture)
          printf '%s\n' "$scan"
          printf '%s\n' "$scan" | grep -q '占位报告'
          printf '%s\n' "$scan" | grep -q 'std::fs: 0'

          found=$(GITHUB_WORKSPACE="$root" bash scripts/resolve-deny-config.sh tests/fixture)
          if [[ "$found" != "$root/deny.toml" ]]; then
            echo "预期从示例 crate 向上找到仓库根 deny.toml，实际是 ${found}" >&2
            exit 1
          fi

          isolated=$(mktemp -d)
          mkdir -p "${isolated}/crate"
          printf '[package]\nname = "t"\nversion = "0.1.0"\nedition = "2021"\n' > "${isolated}/crate/Cargo.toml"
          if GITHUB_WORKSPACE="$isolated" bash scripts/resolve-deny-config.sh "${isolated}/crate"; then
            echo "预期没有 deny.toml 且没有默认文件时失败。" >&2
            exit 1
          fi
          found=$(GITHUB_WORKSPACE="$isolated" DEFAULT_DENY="$root/deny.toml" bash scripts/resolve-deny-config.sh "${isolated}/crate")
          if [[ "$found" != "$root/deny.toml" ]]; then
            echo "预期使用 DEFAULT_DENY，实际是 ${found}" >&2
            exit 1
          fi

          accept_ref() {
            local ref=$1
            if ! bash scripts/check-pinned-ref.sh "$ref"; then
              echo "固定版本应当接受 ${ref}" >&2
              exit 1
            fi
          }
          reject_ref() {
            local ref=$1
            if bash scripts/check-pinned-ref.sh "$ref"; then
              echo "固定版本应当拒绝 ${ref}" >&2
              exit 1
            fi
          }
          accept_ref 0123456789abcdef0123456789abcdef01234567
          accept_ref 0123456789ABCDEF0123456789ABCDEF01234567
          accept_ref 0123456789AbCdEf0123456789aBcDeF01234567
          accept_ref v1.0.0
          reject_ref v1
          reject_ref v1.0
          reject_ref main
          reject_ref 0123456789abcdef0123456789abcdef0123456
          reject_ref 0123456789abcdef0123456789abcdef012345678
          reject_ref 0123456789abcdef0123456789abcdef0123456g

      - name: Check clippy and comments
        run: |
          set -euo pipefail
          root=$(pwd)
          rustup component add clippy >/dev/null

          pass_comments=$(mktemp -d)
          cat > "$pass_comments/lib.rs" <<'EOF'
          // SPDX-License-Identifier: MIT OR Apache-2.0
          // Copyright 2026 BurnCloud

          //! Crate level.

          /// Public addition.
          #[must_use]
          pub const fn add(left: i64, right: i64) -> i64 {
              // EXTERNAL: https://doc.rust-lang.org/std/primitive.i64.html#method.saturating_add
              left.saturating_add(right)
          }

          /// Crate visible.
          pub(crate) fn hidden() -> i32 {
              1
          }

          /// Documented.
          #[derive(
              Clone,
              Copy,
          )]
          pub struct Pair {
              /// Left.
              pub left: i32,
          }

          pub mod inner {
              //! Nested.

              /// Visible.
              pub const N: i32 = 4;

              pub fn text() -> &'static str {
                  let cooked = "http://example.com/a // inside";
                  let raw = r#" // not a comment "#;
                  let raw_hash = r##" /* still text */ "##;
                  let byte_str = b"//";
                  let cstr = c"//";
                  let raw_byte = br#"//"#;
                  let raw_c = cr#"//"#;
                  let ch = '/';
                  let quote = '\'';
                  let slash_slash = '//';
                  let byte_ch = b'/';
                  let escaped = "foo\"//bar";
                  let multi = "foo
          // still inside
          bar";
                  let cont = "foo \
          // still inside";
                  let _ = (cooked, raw, raw_hash, byte_str, cstr, raw_byte, raw_c, ch, quote, slash_slash, byte_ch, escaped, multi, cont);
                  fn f<'a>(s: &'a str) -> &'a str { s }
                  let _ = f("/* not a comment */ // neither");
                  "ok"
              }
          }
          EOF
          python3 "$root/scripts/check-comments.py" "$pass_comments"
          python3 "$root/scripts/check-comments.py" "$root"

          fail_comments() {
            local label="$1"
            local needle="$2"
            local src="$3"
            local dir
            dir=$(mktemp -d)
            printf '%s\n' "$src" > "$dir/lib.rs"
            local status=0
            local out
            out=$(python3 "$root/scripts/check-comments.py" "$dir" 2>&1) || status=$?
            if [[ "$status" -eq 0 ]]; then
              echo "预期 ${label} 失败。" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            if ! grep -F -e "$needle" >/dev/null <<<"$out"; then
              echo "预期 ${label} 的输出包含 ${needle}。" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo "PASS comments ${label}"
          }

          fail_comments narrative 'lib.rs:2:' $'pub fn f() -> i32 {\n    // adds nothing\n    1\n}\n'
          fail_comments block 'lib.rs:2:' $'pub fn f() -> i32 {\n    /* note */\n    1\n}\n'
          fail_comments private-doc 'lib.rs:1:' $'/// hidden\nfn f() -> i32 { 1 }\n'
          fail_comments blank-line 'lib.rs:1:' $'/// hidden\n\npub fn f() -> i32 { 1 }\n'
          fail_comments late-inner 'lib.rs:5:' $'mod m {\n    pub fn f() -> i32 {\n        1\n    }\n    //! late\n}\n'
          fail_comments bad-external 'lib.rs:2:' $'pub fn f() -> i32 {\n    // EXTERNAL: http://example.com\n    1\n}\n'
          fail_comments variant-doc 'lib.rs:2:' $'pub enum E {\n    /// Variant\n    A,\n}\n'

          string_dir=$(mktemp -d)
          printf '%s\n' $'pub fn f() -> i32 {\n    let _ = "http://example.com";\n    // real\n    1\n}\n' > "$string_dir/lib.rs"
          string_out=$(python3 "$root/scripts/check-comments.py" "$string_dir" 2>&1) || string_status=$?
          string_status=${string_status:-0}
          if [[ "$string_status" -eq 0 ]]; then
            echo "预期字符串后面的注释失败。" >&2
            exit 1
          fi
          if ! grep -F -e 'lib.rs:3:' >/dev/null <<<"$string_out"; then
            echo "预期字符串后面的注释报在第 3 行。" >&2
            printf '%s\n' "$string_out" >&2
            exit 1
          fi
          if grep -F -e 'lib.rs:2:' >/dev/null <<<"$string_out"; then
            echo "字符串里的 // 不应报错。" >&2
            printf '%s\n' "$string_out" >&2
            exit 1
          fi
          echo "PASS comments string"

          good=$(mktemp -d)
          mkdir -p "$good/src" "$good/examples"
          printf '%s\n' '[package]' 'name = "sample"' 'version = "0.1.0"' 'edition = "2021"' > "$good/Cargo.toml"
          cat > "$good/src/lib.rs" <<'EOF'
          #[must_use]
          pub const fn answer() -> i32 {
              7
          }

          #[derive(Clone, Copy)]
          pub enum Color {
              Red,
              Blue,
              Green,
          }

          #[must_use]
          pub const fn code(color: Color) -> i32 {
              match color {
                  Color::Red => 1,
                  Color::Blue => 2,
                  Color::Green => 3,
              }
          }

          #[cfg(test)]
          mod tests {
              use super::{answer, code, Color};

              #[allow(dead_code)]
              const fn unused_helper() -> i32 {
                  1
              }

              const fn maybe(n: i32) -> Option<i32> {
                  if n < 0 { None } else { Some(n) }
              }

              fn explode() -> i32 {
                  panic!("boom")
              }

              fn later() -> i32 {
                  todo!("later")
              }

              fn missing() -> i32 {
                  unimplemented!("missing")
              }

              #[test]
              fn restriction_lints_are_allowed() {
                  assert_eq!(maybe(1).unwrap(), 1);
                  assert_eq!(maybe(2).expect("two"), 2);
                  if answer() == 7 {
                      assert_eq!(code(Color::Red), 1);
                  } else {
                      let _ = explode();
                      let _ = later();
                      let _ = missing();
                  }
                  let color = Color::Red;
                  let kind = match color {
                      Color::Red => 1,
                      _ => 0,
                  };
                  assert_eq!(kind, 1);
                  assert_eq!(answer(), 7);
              }
          }
          EOF
          printf '%s\n' 'fn main() {}' > "$good/examples/show.rs"
          cargo generate-lockfile --manifest-path "$good/Cargo.toml" >/dev/null
          good_out=$(bash "$root/scripts/run-clippy.sh" "$good" 2>&1)
          grep -F -e 'clippy: 非测试 --lib --examples' >/dev/null <<<"$good_out"
          grep -F -e 'clippy: 测试 --tests' >/dev/null <<<"$good_out"
          echo "PASS clippy good"

          bin=$(mktemp -d)
          mkdir -p "$bin/src"
          printf '%s\n' '[package]' 'name = "binonly"' 'version = "0.1.0"' 'edition = "2021"' > "$bin/Cargo.toml"
          cat > "$bin/src/main.rs" <<'EOF'
          fn main() {}

          #[cfg(test)]
          mod tests {
              fn maybe(n: i32) -> Option<i32> {
                  if n < 0 { None } else { Some(n) }
              }

              #[test]
              fn allows_unwrap() {
                  assert_eq!(maybe(1).unwrap(), 1);
              }
          }
          EOF
          cargo generate-lockfile --manifest-path "$bin/Cargo.toml" >/dev/null
          bin_out=$(bash "$root/scripts/run-clippy.sh" "$bin" 2>&1)
          grep -F -e 'clippy: 非测试 --bins' >/dev/null <<<"$bin_out"
          if grep -F -e '--lib' >/dev/null <<<"$bin_out"; then
            echo "只有二进制的包不能传 --lib。" >&2
            printf '%s\n' "$bin_out" >&2
            exit 1
          fi
          echo "PASS clippy bin"

          fail_lib() {
            local label="$1"
            local needle="$2"
            local src="$3"
            local dir
            dir=$(mktemp -d)
            mkdir -p "$dir/src"
            printf '%s\n' '[package]' 'name = "sample"' 'version = "0.1.0"' 'edition = "2021"' > "$dir/Cargo.toml"
            printf '%s\n' "$src" > "$dir/src/lib.rs"
            cargo generate-lockfile --manifest-path "$dir/Cargo.toml" >/dev/null
            local status=0
            local out
            out=$(bash "$root/scripts/run-clippy.sh" "$dir" 2>&1) || status=$?
            if [[ "$status" -eq 0 ]]; then
              echo "预期 ${label} 失败。" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            if ! grep -F -e "$needle" >/dev/null <<<"$out"; then
              echo "预期 ${label} 的输出包含 ${needle}。" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
            echo "PASS clippy ${label}"
          }

          fail_lib unwrap '-D clippy::unwrap-used' $'#[must_use]\npub fn bad() -> i32 { Some(1).unwrap() }\n'
          fail_lib expect '-D clippy::expect-used' $'#[must_use]\npub fn bad() -> i32 { Some(1).expect("e") }\n'
          fail_lib panic '-D clippy::panic' $'pub fn bad() { panic!("x"); }\n'
          fail_lib todo '-D clippy::todo' $'pub fn bad() { todo!("x"); }\n'
          fail_lib unimplemented '-D clippy::unimplemented' $'pub fn bad() { unimplemented!("x"); }\n'
          fail_lib wildcard '-D clippy::wildcard-enum-match-arm' $'#[derive(Clone, Copy)]\npub enum Color { Red, Blue, Green }\n#[must_use]\npub const fn code(color: Color) -> i32 {\n    match color { Color::Red => 1, _ => 0 }\n}\n'
          fail_lib allow '-D clippy::allow-attributes-without-reason' $'#[allow(dead_code)]\nconst fn hidden() -> i32 { 1 }\n#[must_use]\npub const fn answer() -> i32 { 7 }\n'
          fail_lib dead '-D dead-code' $'const fn hidden() -> i32 { 1 }\n#[must_use]\npub const fn answer() -> i32 { 7 }\n'
          fail_lib must-use '-D unused-must-use' $'#[must_use]\npub const fn answer() -> i32 { 7 }\npub const fn drop_answer() { answer(); }\n'
          fail_lib test-dead '-D dead-code' $'#[must_use]\npub const fn answer() -> i32 { 7 }\n#[cfg(test)]\nmod tests {\n    const fn never() -> i32 { 1 }\n    #[test]\n    fn ok() { assert_eq!(super::answer(), 7); }\n}\n'
          fail_lib test-must-use '-D unused-must-use' $'#[must_use]\npub const fn answer() -> i32 { 7 }\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn drops() { super::answer(); }\n}\n'
  # 两次调用的 github.workflow 都是本工作流的名字 CI。
  # key 必须不同，组名才分别是 rust-CI-<PR>-self-test 和 rust-CI-<PR>-caller-with，
  # 否则后一次会取消整次运行。
  rust:
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: tests/fixture
      run-proptest: true
      run-fuzz: true
      run-mutants: true
      semver-baseline: 9236264ec7b8a7b22c622fd0d0ad69c495b15348
      concurrency-key: self-test

  caller:
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: tests/fixture
      targets: wasm32-wasip2
      run-proptest: false
      run-fuzz: false
      run-mutants: false
      concurrency-key: caller-with

