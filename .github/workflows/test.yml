name: Test

on:
  workflow_call:
    inputs:
      toolchain:
        description: 仓库没有 rust-toolchain 文件时使用。不要依赖浮动的 stable。
        required: false
        type: string
        default: ""
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."
      targets:
        description: 额外 cargo check target，逗号或空白分隔。插件仓库可填 wasm32-wasip2。
        required: false
        type: string
        default: ""
      wit-dir:
        description: WIT 目录。不存在则跳过。
        required: false
        type: string
        default: wit
      run-proptest:
        description: 为 true 时用 PROPTEST_CASES=256 再跑一遍测试。没有 proptest 依赖则失败。
        required: false
        type: boolean
        default: false
      run-fuzz:
        description: 为 true 时构建并短跑 fuzz target。没有 fuzz/ 则失败。
        required: false
        type: boolean
        default: false
      run-mutants:
        description: 为 true 时运行 cargo-mutants。没有 Cargo.toml 则失败。
        required: false
        type: boolean
        default: false
      postgres:
        description: 为 true 时给 cargo-test 和 mutants 挂 Postgres 16，并设置 DATABASE_URL。默认关闭。
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: ${{ inputs.postgres && '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: cargo test
        working-directory: ${{ inputs.working-directory }}
        env:
          POSTGRES: ${{ inputs.postgres }}
          DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:postgres@127.0.0.1:5432/postgres' || '' }}
        run: |
          set -euo pipefail
          if [[ "$POSTGRES" != "true" ]]; then
            unset DATABASE_URL
          fi
          cargo test --locked --workspace --all-targets --all-features

  doc-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: cargo test --doc
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --locked --workspace --doc

  cargo-doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: cargo doc
        working-directory: ${{ inputs.working-directory }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Check rust-version
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          mapfile -t rows < <(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.rust_version != null) | "\(.name)\t\(.rust_version)"')
          if [[ ${#rows[@]} -eq 0 ]]; then
            echo "msrv: 没有 crate 写 rust-version，跳过最低版本检查。"
            exit 0
          fi
          for row in "${rows[@]}"; do
            name=${row%%$'\t'*}
            version=${row#*$'\t'}
            echo "msrv: ${name} 使用 rust-version ${version} 运行 cargo check。"
            rustup toolchain install "$version" --profile minimal
            cargo "+${version}" check --locked --all-targets --all-features -p "$name"
          done

  extra-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Check extra targets
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGETS//[[:space:],]/}" ]]; then
            echo "extra-targets: 未配置额外 target，跳过。插件仓库可以把 targets 设为 wasm32-wasip2。"
            exit 0
          fi
          mapfile -t targets < <(printf '%s\n' "$TARGETS" | tr ', ' '\n' | sed '/^$/d')
          for target in "${targets[@]}"; do
            echo "extra-targets: cargo check --target ${target}（不编译测试，避免宿主专用的 dev-dependency）"
            rustup target add "$target"
            cargo check --locked --workspace --all-features --target "$target"
          done

  wit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Detect WIT
        id: wit
        working-directory: ${{ inputs.working-directory }}
        env:
          WIT_DIR: ${{ inputs.wit-dir }}
        run: |
          set -euo pipefail
          if [[ ! -d "$WIT_DIR" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "wit: 没有 ${WIT_DIR} 目录，跳过 WIT 校验。"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install wasm-tools
        if: steps.wit.outputs.run == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-tools@1.263.0
          fallback: none

      - name: wasm-tools component wit
        if: steps.wit.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          WIT_DIR: ${{ inputs.wit-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if ! find "$WIT_DIR" -type f -name '*.wit' | grep -q .; then
            echo "wit: ${WIT_DIR} 里没有 .wit 文件。" >&2
            exit 1
          fi
          echo "wit: 校验目录 ${WIT_DIR}"
          wasm-tools component wit "$WIT_DIR"
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "null" ]]; then
            echo "wit: 没有基线提交，跳过接口差异报告。"
            exit 0
          fi
          echo "wit: 与基线 ${BASE_SHA} 的差异。没有单独的 WIT 兼容性工具，这里只报告，不因此失败。"
          if git cat-file -e "${BASE_SHA}:${WIT_DIR}" 2>/dev/null; then
            git diff --relative "$BASE_SHA" -- "$WIT_DIR" || true
          else
            echo "wit: 基线 ${BASE_SHA} 上没有 ${WIT_DIR}，视为新接口。"
          fi

  proptest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Gate
        id: gate
        env:
          RUN: ${{ inputs.run-proptest }}
        run: |
          set -euo pipefail
          if [[ "$RUN" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "proptest: 输入 run-proptest=false，跳过。"
          fi

      - name: Checkout caller
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        if: steps.gate.outputs.run == 'true'
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Run proptest
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            if grep -Eq '(^|[[:space:]])proptest[[:space:]]*(\.|[[:space:]]*=)|package[[:space:]]*=[[:space:]]*"proptest"' "$manifest"; then
              found=1
              break
            fi
          done < <(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/.burncloud-ci/*')
          if [[ "$found" -ne 1 ]]; then
            echo "proptest: 已开启，但工作目录的 Cargo.toml 中没有 proptest 依赖。请添加依赖，或关闭 run-proptest。" >&2
            exit 1
          fi
          echo "proptest: 使用 PROPTEST_CASES=256 运行 cargo test。"
          PROPTEST_CASES=256 cargo test --locked --workspace --all-targets --all-features

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Gate
        id: gate
        env:
          RUN: ${{ inputs.run-fuzz }}
        run: |
          set -euo pipefail
          if [[ "$RUN" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cargo-fuzz: 输入 run-fuzz=false，跳过。"
          fi

      - name: Checkout caller
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout workflow scripts
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        if: steps.gate.outputs.run == 'true'
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Require fuzz targets
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [[ ! -f fuzz/Cargo.toml ]]; then
            echo "cargo-fuzz: 已开启，但 ${PWD}/fuzz/Cargo.toml 不存在。请在该目录运行 cargo fuzz init，或关闭 run-fuzz。" >&2
            exit 1
          fi
          mapfile -t targets < <(find fuzz/fuzz_targets -type f -name '*.rs' -printf '%f\n' | sed 's/\.rs$//')
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "cargo-fuzz: 已找到 fuzz/Cargo.toml，但 fuzz/fuzz_targets 下没有 .rs 目标。" >&2
            exit 1
          fi
          printf '%s\n' "${targets[@]}" > "${RUNNER_TEMP}/fuzz-targets"

      - name: Install nightly
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: nightly-2026-11-20

      - name: Install cargo-fuzz
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
          # 该版本的清单里没有 cargo-fuzz，用 cargo-binstall 装预编译包，不从源码编译。
          fallback: cargo-binstall

      - name: Build and run fuzz targets
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if ! command -v g++ >/dev/null 2>&1; then
            echo "cargo-fuzz: 需要 g++ 来链接 libFuzzer。" >&2
            exit 1
          fi
          # cargo-fuzz 0.13.2 的 build 子命令没有 --locked。先用 metadata 卡住锁文件。
          # 发布的 Linux 二进制是 musl，默认 target 会跟着变成 musl，libFuzzer 在那里编不过。
          host=x86_64-unknown-linux-gnu
          cargo +nightly-2026-11-20 metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null
          cargo +nightly-2026-11-20 fuzz build --target "$host"
          while IFS= read -r target; do
            echo "cargo-fuzz: 运行 ${target}，最长 15 秒。"
            cargo +nightly-2026-11-20 fuzz run "$target" --target "$host" -- -max_total_time=15
          done < "${RUNNER_TEMP}/fuzz-targets"

  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: ${{ inputs.postgres && '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5' || '' }}
    steps:
      - name: Gate
        id: gate
        env:
          RUN: ${{ inputs.run-mutants }}
        run: |
          set -euo pipefail
          if [[ "$RUN" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cargo-mutants: 输入 run-mutants=false，跳过。"
          fi

      - name: Checkout caller
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout workflow scripts
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false
      - name: Resolve toolchain
        if: steps.gate.outputs.run == 'true'
        id: resolve
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/resolve-toolchain.sh
      - name: Install toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}
      - name: Cache cargo
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ inputs.working-directory }}

      - name: Require package
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.toml ]]; then
            echo "cargo-mutants: 已开启，但工作目录没有 Cargo.toml。" >&2
            exit 1
          fi

      - name: Install cargo-mutants
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: cargo mutants
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POSTGRES: ${{ inputs.postgres }}
          DATABASE_URL: ${{ inputs.postgres && 'postgres://postgres:postgres@127.0.0.1:5432/postgres' || '' }}
        run: |
          set -euo pipefail
          if [[ "$POSTGRES" != "true" ]]; then
            unset DATABASE_URL
          fi
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && "$BASE_SHA" != "null" ]]; then
            git diff --relative "$BASE_SHA" -- . > "${RUNNER_TEMP}/pr.diff"
            echo "cargo-mutants: pull request，使用 --in-diff。"
            cargo mutants --timeout 120 --in-diff "${RUNNER_TEMP}/pr.diff"
          else
            echo "cargo-mutants: 非 pull request，检查全部突变。"
            cargo mutants --timeout 120
          fi
