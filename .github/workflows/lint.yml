name: Lint

on:
  workflow_call:
    inputs:
      toolchain:
        description: 仓库没有 rust-toolchain 文件时使用。不要依赖浮动的 stable。
        required: false
        type: string
        default: ""
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}
          components: rustfmt

      - name: cargo fmt
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}
          components: clippy

      - name: cargo clippy
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic

  unsafe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}

      - name: Forbid unsafe
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/check-unsafe.sh "$WORKING_DIRECTORY"
