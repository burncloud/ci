name: Supply chain

on:
  workflow_call:
    inputs:
      toolchain:
        description: 仓库没有 rust-toolchain 文件时使用。不要依赖浮动的 stable。
        required: false
        type: string
        default: ""
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none

      - name: cargo deny
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          config=$(DEFAULT_DENY="${GITHUB_WORKSPACE}/.burncloud-ci/deny.toml" bash .burncloud-ci/scripts/resolve-deny-config.sh "$WORKING_DIRECTORY")
          cargo deny --config "$config" --manifest-path "${WORKING_DIRECTORY}/Cargo.toml" check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: cargo audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then
            echo "cargo-audit: 没有 Cargo.lock。请提交锁文件。" >&2
            exit 1
          fi
          cargo audit

  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install cargo-vet
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-vet@0.10.3
          fallback: none

      - name: cargo vet
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/run-cargo-vet.sh "$WORKING_DIRECTORY"
