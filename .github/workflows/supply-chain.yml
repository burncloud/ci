name: Supply chain

on:
  workflow_call:
    inputs:
      toolchain:
        description: rustup toolchain
        required: false
        type: string
        default: stable
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none

      - name: cargo deny
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          workflow_repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_JSON")
          workflow_sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_JSON")
          if [[ -z "$workflow_repo" || -z "$workflow_sha" || "$workflow_repo" == "null" || "$workflow_sha" == "null" ]]; then
            echo "cargo-deny: 无法从 job 上下文解析工作流定义位置。" >&2
            jq -r 'keys[]' <<<"$JOB_JSON" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/${workflow_repo}/${workflow_sha}/scripts/resolve-deny-config.sh" -o "${RUNNER_TEMP}/resolve-deny-config.sh"
          config=$(WORKFLOW_REPO="$workflow_repo" WORKFLOW_SHA="$workflow_sha" bash "${RUNNER_TEMP}/resolve-deny-config.sh" "$WORKING_DIRECTORY")
          cargo deny --config "$config" --manifest-path "${WORKING_DIRECTORY}/Cargo.toml" check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: cargo audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then
            echo "cargo-audit: 没有 Cargo.lock。请提交锁文件。" >&2
            exit 1
          fi
          cargo audit

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-vet
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-vet@0.10.3
          fallback: none

      - name: cargo vet
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          workflow_repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_JSON")
          workflow_sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_JSON")
          if [[ -z "$workflow_repo" || -z "$workflow_sha" || "$workflow_repo" == "null" || "$workflow_sha" == "null" ]]; then
            echo "cargo-vet: 无法从 job 上下文解析工作流定义位置。" >&2
            jq -r 'keys[]' <<<"$JOB_JSON" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/${workflow_repo}/${workflow_sha}/scripts/run-cargo-vet.sh" -o "${RUNNER_TEMP}/run-cargo-vet.sh"
          bash "${RUNNER_TEMP}/run-cargo-vet.sh" "$WORKING_DIRECTORY"
