name: Rust

on:
  workflow_call:
    inputs:
      toolchain:
        description: 仓库没有 rust-toolchain 文件时使用。不要依赖浮动的 stable。
        required: false
        type: string
        default: ""
      working-directory:
        description: Cargo workspace 根目录，相对仓库根。直接触发且仓库根没有 Cargo.toml 时，只有 burncloud/ci 会回退到 tests/fixture。
        required: false
        type: string
        default: "."
      targets:
        description: 额外 cargo check target，逗号或空白分隔。插件仓库可填 wasm32-wasip2。
        required: false
        type: string
        default: ""
      wit-dir:
        description: WIT 目录。不存在则跳过。
        required: false
        type: string
        default: wit
      run-proptest:
        description: 为 true 时运行 proptest。默认关闭。
        required: false
        type: boolean
        default: false
      run-fuzz:
        description: 为 true 时运行 cargo-fuzz。默认关闭。
        required: false
        type: boolean
        default: false
      run-mutants:
        description: 为 true 时运行 cargo-mutants。默认关闭。
        required: false
        type: boolean
        default: false
      semver-baseline:
        description: auto、base、tag，或其他 git rev
        required: false
        type: string
        default: auto
      protected-paths:
        description: 传给防作弊层。留空则用脚本里的默认列表。
        required: false
        type: string
        default: ""
      concurrency-key:
        description: 同一次调用方工作流里多次 workflow_call 时用来区分并发组。直接触发和单次 uses 留空。
        required: false
        type: string
        default: ""
      postgres:
        description: 为 true 时给 cargo-test 和 mutants 挂 Postgres 16，并设置 DATABASE_URL。默认关闭。
        required: false
        type: boolean
        default: false
      check-pr-body:
        description: 为 false 时跳过 PR 正文标题检查。默认检查。
        required: false
        type: boolean
        default: true
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

# 组名同时带工作流名和 concurrency-key。
# 直接触发时 github.workflow 是 Rust；被 uses 调用时是调用方工作流的名字。
# required workflow 和单次 uses 都不传 key。组名如果只有 rust-<PR>-，两边会互相取消。
# 同一次工作流里的两次 workflow_call 看到的 github.workflow 相同，必须传不同的 key。
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.concurrency-key }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    if: inputs.working-directory == '' || inputs.working-directory == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dir: ${{ steps.dir.outputs.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect workspace
        id: dir
        run: |
          set -euo pipefail
          if [[ -f Cargo.toml ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REPOSITORY" == "burncloud/ci" && -f tests/fixture/Cargo.toml ]]; then
            echo "dir=tests/fixture" >> "$GITHUB_OUTPUT"
          else
            echo "没有仓库根 Cargo.toml。只有 burncloud/ci 可以回退到 tests/fixture。" >&2
            exit 1
          fi

  lint:
    needs: resolve
    if: always() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: burncloud/ci/.github/workflows/lint.yml@ac57f2f9c7fb023525a774a79bd11029015bab87
    with:
      toolchain: ${{ inputs.toolchain }}
      working-directory: ${{ inputs.working-directory || needs.resolve.outputs.dir }}

  test:
    needs: resolve
    if: always() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: burncloud/ci/.github/workflows/test.yml@ac57f2f9c7fb023525a774a79bd11029015bab87
    with:
      toolchain: ${{ inputs.toolchain }}
      working-directory: ${{ inputs.working-directory || needs.resolve.outputs.dir }}
      targets: ${{ inputs.targets }}
      wit-dir: ${{ inputs.wit-dir || 'wit' }}
      run-proptest: ${{ inputs.run-proptest == true }}
      run-fuzz: ${{ inputs.run-fuzz == true }}
      run-mutants: ${{ inputs.run-mutants == true }}
      postgres: ${{ inputs.postgres == true }}

  supply-chain:
    needs: resolve
    if: always() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: burncloud/ci/.github/workflows/supply-chain.yml@ac57f2f9c7fb023525a774a79bd11029015bab87
    with:
      toolchain: ${{ inputs.toolchain }}
      working-directory: ${{ inputs.working-directory || needs.resolve.outputs.dir }}

  api:
    needs: resolve
    if: always() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: burncloud/ci/.github/workflows/api.yml@ac57f2f9c7fb023525a774a79bd11029015bab87
    with:
      toolchain: ${{ inputs.toolchain }}
      working-directory: ${{ inputs.working-directory || needs.resolve.outputs.dir }}
      semver-baseline: ${{ inputs.semver-baseline || 'auto' }}

  protect:
    needs: resolve
    if: always() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: burncloud/ci/.github/workflows/protect.yml@ac57f2f9c7fb023525a774a79bd11029015bab87
    with:
      protected-paths: ${{ inputs.protected-paths }}

  rust-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false

      - name: Check rust-only
        env:
          REPO: ${{ github.repository }}
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          workflow_repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_JSON")
          if [[ -z "$workflow_repo" || "$workflow_repo" == "null" ]]; then
            echo "rust-only: 无法从 job 上下文解析工作流定义位置。" >&2
            exit 1
          fi
          args=()
          if [[ "$REPO" == "burncloud/ci" && "$workflow_repo" == "burncloud/ci" ]]; then
            args+=(--exempt)
          fi
          bash .burncloud-ci/scripts/check-rust-only.sh "${args[@]}"

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false

      - name: Check PR size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "null" ]]; then
            echo "pr-size: 无法确定 diff 的 base，拒绝放行。" >&2
            exit 1
          fi
          if [[ -z "${HEAD_SHA}" || "${HEAD_SHA}" == "null" ]]; then
            echo "pr-size: 无法确定 diff 的 head，拒绝放行。" >&2
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" || ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          fi
          bash .burncloud-ci/scripts/check-pr-size.sh "$BASE_SHA" "$HEAD_SHA"

  pr-body:
    if: github.event_name == 'pull_request' && (inputs.check-pr-body || github.workflow == 'Rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .burncloud-ci
          persist-credentials: false

      - name: Check PR body
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "pr-body: 无法确定 pull request 编号，拒绝放行。" >&2
            exit 1
          fi
          tmp=$(mktemp)
          if ! gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > "$tmp"; then
            echo "pr-body: 读取 PR 正文失败，拒绝放行。" >&2
            exit 1
          fi
          if ! jq -e 'has("body")' "$tmp" >/dev/null; then
            echo "pr-body: 读取 PR 正文失败，拒绝放行。" >&2
            exit 1
          fi
          PR_BODY=$(jq -r '.body // empty' "$tmp") || {
            echo "pr-body: 读取 PR 正文失败，拒绝放行。" >&2
            exit 1
          }
          rm -f "$tmp"
          export PR_BODY
          bash .burncloud-ci/scripts/check-pr-body.sh
