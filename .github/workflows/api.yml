name: API

on:
  workflow_call:
    inputs:
      toolchain:
        description: 仓库没有 rust-toolchain 文件时使用。不要依赖浮动的 stable。
        required: false
        type: string
        default: ""
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."
      semver-baseline:
        description: auto、base、tag，或其他 git rev。auto 在 pull request 上用 base sha，否则用最新 tag。
        required: false
        type: string
        default: auto

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  semver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}
          fetch-depth: "0"
          fetch-tags: "true"

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-semver-checks@0.51.0
          fallback: none

      - name: cargo semver-checks
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SEMVER_BASELINE: ${{ inputs.semver-baseline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .burncloud-ci/scripts/run-semver-checks.sh

  capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}
          components: clippy

      - name: Scan capabilities
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: bash .burncloud-ci/scripts/scan-capabilities.sh "$WORKING_DIRECTORY"

      - name: Reject allow without reason
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::allow_attributes_without_reason
