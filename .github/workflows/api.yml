name: API

on:
  workflow_call:
    inputs:
      toolchain:
        description: rustup toolchain
        required: false
        type: string
        default: stable
      working-directory:
        description: Cargo workspace 根目录，相对仓库根
        required: false
        type: string
        default: "."
      semver-baseline:
        description: auto、base、tag，或其他 git rev。auto 在 pull request 上用 base sha，否则用最新 tag。
        required: false
        type: string
        default: auto

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # 2026-11-15，v1 标签会移动
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-semver-checks@0.51.0
          fallback: none

      - name: cargo semver-checks
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SEMVER_BASELINE: ${{ inputs.semver-baseline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          workflow_repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_JSON")
          workflow_sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_JSON")
          if [[ -z "$workflow_repo" || -z "$workflow_sha" || "$workflow_repo" == "null" || "$workflow_sha" == "null" ]]; then
            echo "semver: 无法从 job 上下文解析工作流定义位置。" >&2
            jq -r 'keys[]' <<<"$JOB_JSON" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/${workflow_repo}/${workflow_sha}/scripts/run-semver-checks.sh" -o "${RUNNER_TEMP}/run-semver-checks.sh"
          bash "${RUNNER_TEMP}/run-semver-checks.sh"

  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan capabilities
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          workflow_repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_JSON")
          workflow_sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_JSON")
          if [[ -z "$workflow_repo" || -z "$workflow_sha" || "$workflow_repo" == "null" || "$workflow_sha" == "null" ]]; then
            echo "capabilities: 无法从 job 上下文解析工作流定义位置。" >&2
            jq -r 'keys[]' <<<"$JOB_JSON" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/${workflow_repo}/${workflow_sha}/scripts/scan-capabilities.sh" -o "${RUNNER_TEMP}/scan-capabilities.sh"
          bash "${RUNNER_TEMP}/scan-capabilities.sh" "$WORKING_DIRECTORY"
